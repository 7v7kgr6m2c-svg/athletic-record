<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>田徑成績管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
        <span class="text-blue-600">🏃</span> 田徑紀錄助手
      </h1>
      <span class="text-xs bg-slate-100 text-slate-500 font-medium px-2.5 py-1 rounded-full border border-slate-200">v1.2</span>
    </div>
  </header>

  <!-- 主要內容區域 -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 表單分頁：新增/編輯成績 -->
    <div id="tab-form" class="space-y-4">
      <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs">
        <div class="flex justify-between items-center mb-4">
          <h2 id="form-title" class="text-lg font-bold text-slate-800">新增成績</h2>
          <button id="cancel-edit-btn" type="button" onclick="cancelEditMode()" class="hidden text-xs font-semibold text-slate-500 hover:text-slate-700 bg-slate-100 px-3 py-1.5 rounded-full cursor-pointer">
            取消編輯
          </button>
        </div>

        <form id="record-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <input type="hidden" id="edit-record-id" value="">

          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">賽事名稱</label>
            <input type="text" id="competition" required placeholder="例如：全港學界田徑錦標賽" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">日期</label>
              <input type="date" id="date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">項目</label>
              <select id="event-name" onchange="onEventSelectChange()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="100m">100米</option>
                <option value="200m">200米</option>
                <option value="400m">400米</option>
                <option value="800m">800米</option>
                <option value="跳遠">跳遠</option>
                <option value="鉛球">鉛球</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">階段</label>
              <select id="stage" onchange="onStageChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="初賽">初賽</option>
                <option value="複賽">複賽</option>
                <option value="決賽">決賽</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">名次/獎牌</label>
              <select id="rank" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="冠軍">冠軍 🥇</option>
                <option value="亞軍">亞軍 🥈</option>
                <option value="季軍">季軍 🥉</option>
                <option value="第4名">第4名</option>
                <option value="第5名">第5名</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">成績表現</label>
            <input type="text" id="result-val" required placeholder="例如：11.52 或 5.85" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-sm cursor-pointer">
            儲存紀錄
          </button>
        </form>
      </div>
    </div>

    <!-- 歷史紀錄分頁 -->
    <div id="tab-history" class="space-y-3 hidden">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-base font-bold text-slate-700">過往賽事紀錄</h2>
        <span id="record-count" class="text-xs font-semibold text-slate-400">共 0 項</span>
      </div>
      <div id="records-list" class="space-y-3">
        <!-- 卡片列表動態渲染 -->
      </div>
    </div>

  </main>

  <!-- 底部導覽分頁按鈕 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-20">
    <div class="max-w-md mx-auto grid grid-cols-2 text-center text-xs font-bold py-2">
      <button onclick="switchMainTab('form')" id="nav-btn-form" class="py-2 text-blue-600 flex flex-col items-center gap-1 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span>新增紀錄</span>
      </button>
      <button onclick="switchMainTab('history')" id="nav-btn-history" class="py-2 text-slate-400 flex flex-col items-center gap-1 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>歷史紀錄</span>
      </button>
    </div>
  </nav>

  <!-- JS 邏輯 -->
  <script>
    // 預設資料庫
    let records = [
      { id: '1', competition: '全港學界田徑錦標賽', date: '2026-03-15', name: '100m', stage: '決賽', rank: '冠軍', val: '10.85', unit: '秒' },
      { id: '2', competition: '分齡田徑賽', date: '2026-02-20', name: '跳遠', stage: '決賽', rank: '亞軍', val: '6.45', unit: '米' }
    ];

    let touchStartX = 0;
    let touchStartY = 0;

    // 初始化頁面
    document.addEventListener('DOMContentLoaded', () => {
      setInitialTodayDate();
      renderList();
    });

    function setInitialTodayDate() {
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
    }

    // 切換頁籤
    function switchMainTab(tab) {
      const formTab = document.getElementById('tab-form');
      const historyTab = document.getElementById('tab-history');
      const btnForm = document.getElementById('nav-btn-form');
      const btnHistory = document.getElementById('nav-btn-history');

      if (tab === 'form') {
        formTab.classList.remove('hidden');
        historyTab.classList.add('hidden');
        btnForm.className = 'py-2 text-blue-600 flex flex-col items-center gap-1 cursor-pointer';
        btnHistory.className = 'py-2 text-slate-400 flex flex-col items-center gap-1 cursor-pointer';
      } else {
        formTab.classList.add('hidden');
        historyTab.classList.remove('hidden');
        btnForm.className = 'py-2 text-slate-400 flex flex-col items-center gap-1 cursor-pointer';
        btnHistory.className = 'py-2 text-blue-600 flex flex-col items-center gap-1 cursor-pointer';
      }
    }

    function onEventSelectChange() {}
    function onStageChange() {}

    // 觸控手勢處理
    window.handleCardTouchStart = function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    };

    window.handleCardTouchEnd = function(e, id) {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchStartX - touchEndX;
      const diffY = Math.abs(touchStartY - touchEndY);

      if (diffY < 30) {
        const contentEl = document.getElementById(`card-content-${id}`);
        const actionsEl = document.getElementById(`card-actions-${id}`);
        if (!contentEl || !actionsEl) return;

        if (diffX > 50) {
          // 向左滑動 -> 位移 -128px (顯示編輯與刪除按鈕)
          contentEl.style.transform = 'translateX(-128px)';
          actionsEl.style.transform = 'translateX(0)';
        } else if (diffX < -50) {
          // 向右滑動 -> 復原隱藏
          contentEl.style.transform = 'translateX(0)';
          actionsEl.style.transform = 'translateX(100%)';
        }
      }
    };

    // 產生名次 Badge
    function getRankBadgeHtml(rank) {
      if (rank === '冠軍') return `<span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-0.5 rounded-full border border-amber-200">🥇 冠軍</span>`;
      if (rank === '亞軍') return `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-0.5 rounded-full border border-slate-200">🥈 亞軍</span>`;
      if (rank === '季軍') return `<span class="bg-orange-100 text-orange-700 text-xs font-bold px-2 py-0.5 rounded-full border border-orange-200">🥉 季軍</span>`;
      return `<span class="bg-slate-50 text-slate-500 text-xs font-bold px-2 py-0.5 rounded-full border border-slate-200">${rank}</span>`;
    }

    // 構建卡片 HTML
    function buildRecordCardHtml(r) {
      const cleanName = r.name;
      const showCompInHeader = true;
      const subInfoText = r.stage;
      const resultDisplay = `<span class="text-xl font-black text-slate-800 font-mono">${r.val}</span><span class="text-xs text-slate-500 ml-1 font-medium">${r.unit || ''}</span>`;
      const ageText = '';

      return `
        <div class="relative overflow-hidden bg-white rounded-3xl border border-slate-200/80 shadow-xs"
             ontouchstart="handleCardTouchStart(event)" 
             ontouchend="handleCardTouchEnd(event, '${r.id}')">
          
          <!-- 向左滑動出現的操作區塊（寬度 w-32 = 128px） -->
          <div id="card-actions-${r.id}" class="absolute right-0 top-0 bottom-0 w-32 flex transition-transform duration-300 translate-x-full z-10 font-bold text-sm">
            <button type="button" onclick="editRecord('${r.id}')" class="flex-1 bg-blue-600 text-white flex items-center justify-center cursor-pointer">
              編輯
            </button>
            <button type="button" onclick="deleteRecord('${r.id}')" class="flex-1 bg-red-600 text-white flex items-center justify-center cursor-pointer">
              刪除
            </button>
          </div>

          <!-- 卡片主要內容區塊 -->
          <div id="card-content-${r.id}" class="transition-transform duration-300 bg-white">
            ${showCompInHeader ? `
              <div class="bg-slate-50 px-4 py-2.5 flex justify-between items-center border-b border-slate-100">
                <span class="font-bold text-slate-800 text-sm md:text-base">${r.competition}</span>
                <span class="text-xs font-medium text-slate-400 font-mono">${r.date.replace(/-/g, '/')}</span>
              </div>
            ` : ''}

            <div class="p-4 space-y-2">
              <div class="flex items-start justify-between gap-3">
                <div class="space-y-1">
                  <div class="flex items-center gap-3">
                    ${getRankBadgeHtml(r.rank)}
                    <h3 class="text-lg md:text-xl font-extrabold text-slate-800">${cleanName}</h3>
                  </div>
                  <div class="pl-[52px] text-xs text-slate-400 font-medium">
                    <span>${subInfoText || '賽事紀錄'}</span>
                  </div>
                </div>

                <div class="text-right flex flex-col items-end">
                  <div class="flex items-baseline">
                    ${resultDisplay}
                  </div>
                  <span class="text-xs text-slate-400 font-medium mt-1">${ageText}</span>
                </div>
              </div>
            </div>

            ${r.isCombined && r.subDetails?.length > 0 ? `
              <div class="px-4 pb-3 border-t border-slate-100 pt-2 bg-slate-50/50">
                <button onclick="toggleSubDetails('${r.id}')" class="text-xs font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1 cursor-pointer">
                  <span>查看全能單項細項 (${r.subDetails.length})</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="sub-${r.id}" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">
                  ${r.subDetails.map(sub => {
                    const subUnit = sub.type === 'distance' ? '米' : (sub.type === 'time' ? '秒' : '分');
                    const valDisplay = (sub.val && sub.status === 'NORMAL') ? `${sub.val} ${subUnit}` : sub.val;
                    return `
                    <div class="bg-white p-2 rounded-xl border border-slate-200 text-xs text-slate-600 flex justify-between">
                      <span class="font-bold text-slate-700">${sub.name}</span>
                      <span class="font-mono">${valDisplay} (${sub.pts}分)</span>
                    </div>
                  `}).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // 渲染歷史列表
    function renderList() {
      const container = document.getElementById('records-list');
      document.getElementById('record-count').textContent = `共 ${records.length} 項`;

      if (records.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">尚無紀錄</div>`;
        return;
      }

      container.innerHTML = records.map(r => buildRecordCardHtml(r)).join('');
    }

    // 新增/修改處理
    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-record-id').value;
      const comp = document.getElementById('competition').value;
      const date = document.getElementById('date').value;
      const name = document.getElementById('event-name').value;
      const stage = document.getElementById('stage').value;
      const rank = document.getElementById('rank').value;
      const val = document.getElementById('result-val').value;

      if (editId) {
        records = records.map(r => r.id === editId ? { ...r, competition: comp, date, name, stage, rank, val } : r);
      } else {
        records.unshift({
          id: Date.now().toString(),
          competition: comp,
          date,
          name,
          stage,
          rank,
          val,
          unit: name.includes('m') ? '秒' : '米'
        });
      }

      cancelEditMode();
      switchMainTab('history');
    }

    // 點擊編輯
    window.editRecord = function(id) {
      const target = records.find(r => r.id === id);
      if (!target) return;

      document.getElementById('edit-record-id').value = target.id;
      document.getElementById('competition').value = target.competition;
      document.getElementById('date').value = target.date;
      document.getElementById('event-name').value = target.name;
      document.getElementById('stage').value = target.stage;
      document.getElementById('rank').value = target.rank;
      document.getElementById('result-val').value = target.val;

      document.getElementById('form-title').textContent = '編輯成績紀錄';
      document.getElementById('submit-btn').textContent = '更新紀錄';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');

      switchMainTab('form');
    };

    // 點擊刪除
    window.deleteRecord = function(id) {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        records = records.filter(r => r.id !== id);
        renderList();
      }
    };

    // 取消編輯狀態 (修正邏輯：取消編輯會觸發 return 返回歷史紀錄)
    window.cancelEditMode = function() {
      const isEditing = document.getElementById('edit-record-id').value !== '';

      document.getElementById('edit-record-id').value = '';
      document.getElementById('form-title').textContent = '新增成績';
      document.getElementById('submit-btn').textContent = '儲存紀錄';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('record-form').reset();
      setInitialTodayDate();
      onEventSelectChange();
      onStageChange();

      renderList();

      // 若原本處於編輯狀態，取消後自動切換返回「歷史記錄」分頁
      if (isEditing) {
        switchMainTab('history');
      }
    };
  </script>
</body>
</html>

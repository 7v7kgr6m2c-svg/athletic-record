<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <!-- 1. 標準 SVG Favicon（加上 ?v=1 避開快取） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">

    <!-- 2. 備用 PNG / ICO 格式（建議準備一份 32x32 的 PNG 或 ICO） -->
    <link rel="alternate icon" type="image/png" href="/favicon_180x180.png?v=1">

    <!-- 3. iOS / Apple 裝置專用圖示（加書籤或分頁卡片時會讀取這張） -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_180x180.png?v=1">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>選擇運動項目</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen w-screen p-4 md:p-8 flex items-center justify-center select-none overflow-hidden">

    <div class="w-full max-w-md space-y-6 text-center">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-2">
            <h2 id="athlete-greeting" class="text-2xl font-black text-slate-900 tracking-tight">請選擇記錄項目</h2>
            <p class="text-xs md:text-sm text-slate-500 font-medium">選擇您要管理或查看的運動種類</p>
        </div>

        <div class="grid grid-cols-1 gap-5">
            <!-- 田徑按鈕（橙紅色跑道漸層，內襯加大） -->
            <button onclick="goToSport('main_a.html')" class="bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white p-8 rounded-3xl shadow-lg flex items-center justify-between transition transform active:scale-98 cursor-pointer">
                <div class="flex items-center gap-4">
                    <span class="text-4xl">🏃</span>
                    <h3 class="text-2xl font-bold flex items-baseline gap-2">
                        <span>田徑</span>
                        <span class="text-base font-medium opacity-90 font-sans">Track & Field</span>
                    </h3>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>

            <!-- 游泳按鈕（水藍色漸層，內襯加大） -->
            <button onclick="goToSport('main_s.html')" class="bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 text-white p-8 rounded-3xl shadow-lg flex items-center justify-between transition transform active:scale-98 cursor-pointer">
                <div class="flex items-center gap-4">
                    <span class="text-4xl">🏊</span>
                    <h3 class="text-2xl font-bold flex items-baseline gap-2">
                        <span>游泳</span>
                        <span class="text-base font-medium opacity-90 font-sans">Swimming</span>
                    </h3>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <button onclick="window.location.href='athletes.html'" class="w-full bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 font-bold py-3.5 rounded-2xl shadow-sm transition cursor-pointer">
            返回運動員列表
        </button>
    </div>

    <script>
        const athleteName = localStorage.getItem('current_athlete_name');
        if (athleteName) {
            document.getElementById('athlete-greeting').textContent = `你好，${athleteName}`;
        }
        function goToSport(page) {
            window.location.href = page;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>選擇運動項目</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/prevent-gestures.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen w-screen p-4 md:p-8 flex items-center justify-center select-none overflow-hidden">

    <div class="w-full max-w-md space-y-6 text-center">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-2 flex flex-col items-center">
            <img src="images/logo.png" alt="Logo" class="w-12 h-12 mb-1">
            <h2 id="athlete-greeting" class="text-2xl font-black text-slate-900 tracking-tight">請選擇記錄項目</h2>
            <p class="text-xs md:text-sm text-slate-500 font-medium">選擇您要管理或查看的運動種類</p>
        </div>

        <div class="grid grid-cols-1 gap-5">
            <!-- 田徑項目按鈕 -->
            <button id="btn-sport-track" class="bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white p-8 rounded-3xl shadow-lg flex items-center justify-between transition transform active:scale-98 cursor-pointer w-full">
                <div class="flex items-center gap-4">
                    <span class="text-4xl">🏃</span>
                    <h3 class="text-2xl font-bold flex items-baseline gap-2">
                        <span>田徑</span>
                        <span class="text-base font-medium opacity-90 font-sans">Track & Field</span>
                    </h3>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>

            <!-- 游泳項目按鈕 -->
            <button id="btn-sport-swim" class="bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 text-white p-8 rounded-3xl shadow-lg flex items-center justify-between transition transform active:scale-98 cursor-pointer w-full">
                <div class="flex items-center gap-4">
                    <span class="text-4xl">🏊</span>
                    <h3 class="text-2xl font-bold flex items-baseline gap-2">
                        <span>游泳</span>
                        <span class="text-base font-medium opacity-90 font-sans">Swimming</span>
                    </h3>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <button id="btn-back-athletes" class="w-full bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 font-bold py-3.5 rounded-2xl shadow-sm transition cursor-pointer">
            返回運動員列表
        </button>
    </div>

    <script src="js/select_sport.js"></script>
</body>
</html>

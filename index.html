<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- Viewport 鎖定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>運動紀錄系統 - 快捷登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FirebaseUI CSS 與 Firebase Compat SDKs -->
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>

    <style>
        /* 禁用手勢與雙擊縮放，全版面鎖定禁止滑動 */
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100%;
            overflow: hidden;
            margin: 0;
        }

        /* 強制輸入框字級降至最低 16px */
        input, select, textarea {
            font-size: 16px !important;
        }

        .login-card { 
            width: 100%; 
            max-width: 440px; 
            padding: 40px 32px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px; 
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05); 
            text-align: center; 
            box-sizing: border-box; 
        }

        /* 優化 FirebaseUI 樣式整合 */
        .firebaseui-card-content {
            padding: 0 !important;
        }
        .firebaseui-container {
            max-width: 100% !important;
            background-color: transparent !important;
            box-shadow: none !important;
        }
    </style>
    <script>
      // 全方位攔截 iOS Safari 手勢與雙擊縮放
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });

      document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { e.preventDefault(); }
        lastTouchEnd = now;
      }, false);
    </script>
</head>
<body class="h-screen w-screen flex items-center justify-center select-none p-6 overflow-hidden">

    <div class="login-card">
        <!-- 精美視覺 Icon -->
        <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
        </div>

        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">歡迎使用運動紀錄系統</h2>
        <p class="text-sm text-slate-500 mb-6 font-medium">請選擇登入方式以存取專屬管理系統</p>

        <!-- FirebaseUI 渲染容器 -->
        <div id="firebaseui-auth-container"></div>
    </div>

    <!-- 自訂 Modal -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="custom-alert-icon" class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">❌</div>
            <p id="custom-alert-msg" class="text-sm font-medium text-slate-800 whitespace-pre-line"></p>
            <button onclick="closeCustomAlert()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow cursor-pointer transition">確認</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA40NWznF4c7Gz2FNzVTCyse_Tm9gp-1n0",
            authDomain: "athletes-record.firebaseapp.com",
            projectId: "athletes-record",
            storageBucket: "athletes-record.appspot.com",
            messagingSenderId: "259439207122",
            appId: "1:259439207122:web:26d6211ac1379c936e030b",
            measurementId: "G-F3ZH9YN0VT"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);

        window.showAlert = function(msg) {
            document.getElementById('custom-alert-msg').textContent = msg;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        window.closeCustomAlert = function() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }

        // 自動監聽登入狀態轉頁
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'athletes.html';
            }
        });

        // 初始化 FirebaseUI 實例
        const ui = new firebaseui.auth.AuthUI(firebase.auth());

        // FirebaseUI 設定檔
        const uiConfig = {
            callbacks: {
                signInSuccessWithAuthResult: function(authResult, redirectUrl) {
                    window.location.href = 'athletes.html';
                    return false;
                }
            },
            // 停用平臺發起的密碼輔助快取，避免帳號連結衝突與循環提示
            credentialHelper: firebaseui.auth.CredentialHelper.NONE,
            signInFlow: 'popup',
            signInSuccessUrl: 'athletes.html',
            signInOptions: [
                {
                    provider: firebase.auth.EmailAuthProvider.PROVIDER_ID,
                    signInMethod: firebase.auth.EmailAuthProvider.EMAIL_PASSWORD_SIGN_IN_METHOD,
                    requireDisplayName: true
                },
                firebase.auth.GoogleAuthProvider.PROVIDER_ID
            ]
        };

        // 啟動 FirebaseUI
        ui.start('#firebaseui-auth-container', uiConfig);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳轉測試</title>
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f1f5f9; 
            font-family: sans-serif; 
        }
        .btn { 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold; 
            color: white; 
            background-color: #2563eb; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
        }
        .btn:hover { 
            background-color: #1d4ed8; 
        }
    </style>
</head>
<body>

    <!-- 點擊按鈕執行跳轉 -->
    <button class="btn" onclick="goToAthletes()">跳轉到 athletes.html</button>

    <script>
        function goToAthletes() {
            window.location.href = 'athletes.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>運動員成績管理系統 - 登入</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/prevent-gestures.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4 select-none">

    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-md border border-slate-200/60 text-center space-y-6">
        <div class="space-y-2 flex flex-col items-center">
            <img src="images/logo.png" alt="Logo" class="w-16 h-16 mb-2">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">成績管理系統</h1>
            <p class="text-xs font-medium text-slate-400">請登入您的帳號以繼續使用</p>
        </div>

        <form id="login-form" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 ml-1">電子郵件</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 ml-1">密碼</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-98 cursor-pointer mt-2">
                登入系統
            </button>
        </form>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>

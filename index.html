<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Track & Wave - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
        }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen w-screen p-4 flex items-center justify-center select-none">

    <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-xl space-y-5 border border-slate-100 text-center">
        <!-- Brand Logo & Title -->
        <div class="space-y-2">
            <div class="flex items-center justify-center pt-2">
                <!-- 品牌 Logo 圖片 (請確認圖檔路徑是否為 logo.png) -->
                <img src="logo.png" alt="Track & Wave Logo" class="h-22 object-contain">
            </div>
            <p class="text-xs text-slate-400 font-medium">歡迎使用 Track & Wave 運動數據管理系統</p>
        </div>

        <!-- 登入表單 -->
        <div class="space-y-3.5 text-left pt-1">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">電子郵件 (Email)</label>
                <input type="email" id="email-input" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm bg-slate-50 transition" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">密碼 (Password)</label>
                <input type="password" id="password-input" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm bg-slate-50 transition" placeholder="••••••••">
            </div>

            <button type="button" id="btn-email-login" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl shadow transition text-sm cursor-pointer mt-1">
                Email 密碼登入
            </button>
        </div>

        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-3 text-slate-400 text-xs font-bold">或</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Google 快捷登入 -->
        <button type="button" id="btn-google-login" class="w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold py-3.5 rounded-xl shadow-xs transition flex items-center justify-center gap-3 text-sm cursor-pointer">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <span>使用 Google 帳戶快捷登入</span>
        </button>
    </div>

    <!-- 自訂 Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="alert-icon" class="w-12 h-12 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">i</div>
            <p id="alert-msg" class="text-sm font-medium text-slate-800 whitespace-pre-line"></p>
            <button onclick="closeAlert()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-sm shadow cursor-pointer transition">確認</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA40NWznF4c7Gz2FNzVTCyse_Tm9gp-1n0",
            authDomain: "athletes-record.firebaseapp.com",
            projectId: "athletes-record",
            storageBucket: "athletes-record.appspot.com",
            messagingSenderId: "259439207122",
            appId: "1:259439207122:web:26d6211ac1379c936e030b",
            measurementId: "G-F3ZH9YN0VT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showAlert(msg, isSuccess = false) {
            document.getElementById('alert-msg').textContent = msg;
            const iconEl = document.getElementById('alert-icon');
            if (isSuccess) {
                iconEl.textContent = '✅';
                iconEl.className = 'w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold';
            } else {
                iconEl.textContent = '⚠️';
                iconEl.className = 'w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold';
            }
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        window.closeAlert = function() {
            document.getElementById('alert-modal').classList.add('hidden');
        }

        // 自動轉址：若已登入則跳轉至運動員頁面
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'athletes.html';
            }
        });

        // 1. 原生 Email + 密碼 登入
        document.getElementById('btn-email-login').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                showAlert('請輸入 Email 與密碼！');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error('登入失敗：', err);
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    showAlert('Email 或密碼不正確，請重新檢查！');
                } else if (err.code === 'auth/invalid-email') {
                    showAlert('請輸入有效的 Email 格式！');
                } else {
                    showAlert('登入失敗：' + err.message);
                }
            }
        });

        // 2. Google 快捷登入
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                console.error('Google 登入失敗：', err);
                showAlert('Google 登入失敗：' + err.message);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田徑紀錄系統 - 快捷登入</title>
    <style>
        body { background-color: #f1f5f9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-container { width: 100%; max-width: 400px; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; box-sizing: border-box; }
        h2 { color: #0f172a; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .btn-oauth { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s; }
        .btn-oauth:hover { opacity: 0.9; }
        .btn-google { background-color: #4285F4; }
        .btn-oauth:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>歡迎使用田徑紀錄系統</h2>
        <p class="subtitle">請使用 Google 帳戶快捷註冊或登入</p>

        <button id="login-btn" onclick="handleGoogleLogin()" class="btn-oauth btn-google">
            <span>使用 Google 帳戶登入</span>
        </button>
    </div>

    <!-- 引入 Firebase SDK (使用 ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA40NWznF4c7Gz2FNzVTCyse_Tm9gp-1n0",
            authDomain: "athletes-record.firebaseapp.com",
            projectId: "athletes-record",
            storageBucket: "athletes-record.appspot.com",
            messagingSenderId: "259439207122",
            appId: "1:259439207122:web:26d6211ac1379c936e030b",
            measurementId: "G-F3ZH9YN0VT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 自動檢查登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'athletes.html';
            }
        });

        // 綁定到全域讓按鈕呼叫
        window.handleGoogleLogin = async function() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;

            // 設定 8 秒超時提示（防止 Safari/iOS 阻擋 popup 卻沒有觸發 error 的情況）
            const timeoutId = setTimeout(() => {
                alert('登入回應時間較長。如果沒有跳出登入視窗，請檢查瀏覽器是否開啟了「阻擋彈出式視窗 / 快顯視窗」功能！');
                btn.disabled = false;
            }, 8000);

            try {
                const result = await signInWithPopup(auth, provider);
                clearTimeout(timeoutId); // 成功登入後清除超時提示
                window.location.href = 'athletes.html';
            } catch (error) {
                clearTimeout(timeoutId); // 發生錯誤時清除超時提示
                btn.disabled = false;
                
                // 針對常見的 Popup 阻擋錯誤碼做明確提示
                if (error.code === 'auth/popup-blocked') {
                    alert('登入失敗：你的瀏覽器阻擋了彈出式視窗！\n請喺 Safari 或 Chrome 設定中允許「彈出式視窗 (Popup)」，然後再試一次。');
                } else if (error.code === 'auth/popup-closed-by-user') {
                    // 用戶自己按交叉關閉，不需特別提示
                } else {
                    alert('Google 登入失敗：' + error.message + '\n（如無法跳轉，請檢查瀏覽器是否阻擋了彈出式視窗）');
                }
            }
        };
    </script>
</body>
</html>

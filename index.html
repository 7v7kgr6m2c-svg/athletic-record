<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Track & Wave - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden !important;
            touch-action: none !important;
            -webkit-user-select: none;
            user-select: none;
            -webkit-text-size-adjust: 100%;
            margin: 0; padding: 0;
        }
        input { font-size: 16px !important; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-[100dvh] w-vw flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-lg bg-white rounded-3xl p-5 sm:p-7 shadow-xl space-y-4 sm:space-y-5 border border-slate-100 text-center my-auto">
        <div class="space-y-0 flex flex-col items-center">
            <div class="flex items-center justify-center p-0 m-0">
                <img src="images/logo.png" alt="Track & Wave Logo" class="h-48 sm:h-64 object-contain mx-auto pointer-events-none block" onerror="this.src='logo.png'">
            </div>
            <p class="text-xs sm:text-sm text-slate-400 font-medium -mt-2 p-0">歡迎使用 Track & Wave 運動數據管理系統</p>
        </div>

        <div class="space-y-3 sm:space-y-3.5 text-left pt-1">
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">電子郵件 (Email)</label>
                <input type="email" id="email-input" class="w-full px-4 py-3 sm:py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm sm:text-base bg-slate-50 transition" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">密碼 (Password)</label>
                <input type="password" id="password-input" class="w-full px-4 py-3 sm:py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm sm:text-base bg-slate-50 transition" placeholder="••••••••">
            </div>

            <button type="button" id="btn-email-login" class="w-full bg-sky-600 hover:bg-sky-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow transition text-sm sm:text-base cursor-pointer mt-1">
                Email 密碼登入
            </button>
        </div>

        <div class="relative flex py-0.5 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-3 text-slate-400 text-xs sm:text-sm font-bold">或</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button type="button" id="btn-google-login" class="w-full bg-white hover:bg-slate-50 active:scale-[0.98] text-slate-700 border border-slate-200 font-bold py-3.5 rounded-xl shadow-xs transition flex items-center justify-center gap-3 text-sm sm:text-base cursor-pointer">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <span>使用 Google 帳戶快捷登入</span>
        </button>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="alert-icon" class="w-12 h-12 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">i</div>
            <p id="alert-msg" class="text-sm font-medium text-slate-800 whitespace-pre-line"></p>
            <button id="btn-close-alert" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-sm shadow cursor-pointer transition">確認</button>
        </div>
    </div>

    <script type="module" src="js/index.js？v=1.0.1"></script>
</body>
</html>

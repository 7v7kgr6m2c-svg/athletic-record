<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- Viewport 鎖定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>田徑紀錄系統 - 快捷登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 禁用手勢與雙擊縮放 */
        html, body, input, select, textarea, button {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            background-color: #f1f5f9;
            font-family: sans-serif;
        }

        /* 強制輸入框字級降至最低 16px */
        input, select, textarea {
            font-size: 16px !important;
        }

        .login-container { width: 100%; max-width: 400px; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; box-sizing: border-box; }
        h2 { color: #0f172a; margin-bottom: 8px; font-size: 24px; font-weight: bold; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .btn-oauth { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; display: flex; items-center; justify-content: center; gap: 10px; transition: opacity 0.2s; }
        .btn-oauth:hover { opacity: 0.9; }
        .btn-google { background-color: #4285F4; }
    </style>
    <script>
      // 全方位攔截 iOS Safari 手勢與雙擊縮放
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });

      document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { e.preventDefault(); }
        lastTouchEnd = now;
      }, false);
    </script>
</head>
<body class="min-h-screen flex items-center justify-center select-none p-4">

    <div class="login-container">
        <h2>歡迎使用田徑紀錄系統</h2>
        <p class="subtitle">請使用 Google 帳戶快捷註冊或登入</p>

        <button onclick="handleGoogleLogin()" class="btn-oauth btn-google">
            <span>使用 Google 帳戶登入</span>
        </button>
    </div>

    <!-- 自訂 Modal -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="custom-alert-icon" class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">❌</div>
            <p id="custom-alert-msg" class="text-sm font-medium text-slate-800 whitespace-pre-line"></p>
            <button onclick="closeCustomAlert()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm shadow cursor-pointer transition">確認</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA40NWznF4c7Gz2FNzVTCyse_Tm9gp-1n0",
            authDomain: "athletes-record.firebaseapp.com",
            projectId: "athletes-record",
            storageBucket: "athletes-record.appspot.com",
            messagingSenderId: "259439207122",
            appId: "1:259439207122:web:26d6211ac1379c936e030b",
            measurementId: "G-F3ZH9YN0VT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.showAlert = function(msg) {
            document.getElementById('custom-alert-msg').textContent = msg;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        window.closeCustomAlert = function() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'athletes.html';
            }
        });

        window.handleGoogleLogin = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                window.location.href = 'athletes.html';
            } catch (error) {
                showAlert('Google 登入失敗：' + error.message);
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田徑紀錄系統 - 快捷登入</title>
    <!-- 引入 Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f1f5f9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-container { width: 100%; max-width: 400px; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; box-sizing: border-box; }
        h2 { color: #0f172a; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .btn-oauth { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s; }
        .btn-oauth:hover { opacity: 0.9; }
        .btn-google { background-color: #4285F4; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>歡迎使用田徑紀錄系統</h2>
        <p class="subtitle">請使用 Google 帳戶快捷註冊或登入</p>

        <!-- 直接在 HTML 綁定 onclick 函式 -->
        <button onclick="handleLogin()" class="btn-oauth btn-google">
            <span>使用 Google 帳戶登入</span>
        </button>
    </div>

        <script>
        // 1. 測試彈窗：確保腳本有在跑
        alert("網頁腳本開始執行");

        const SUPABASE_URL = 'https://csgxxfmhqloukuuwuhhd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzZ3h4Zm1ocWxvdWt1dXd1aGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzk4NDMsImV4cCI6MjEwMTY1NTg0M30.9LdpqaZqX51Ht1LMNQ_gf3SQjSTPBkykxxx5tA-CNdU';

        let supabase = null;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            alert("Supabase 初始化成功！");
        } catch (e) {
            alert("Supabase 初始化失敗報錯: " + e.message);
        }

        async function handleLogin() {
            if (!supabase) {
                alert("錯誤：supabase 物件不存在！");
                return;
            }

            alert("準備向 Google 發起登入請求...");
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/athletes.html',
                    skipBrowserRedirect: true
                }
            });

            if (error) {
                alert("登入錯誤: " + error.message);
            } else if (data && data.url) {
                alert("成功取得網址，跳轉中！");
                window.location.href = data.url;
            } else {
                alert("未回傳網址");
            }
        }
    </script>

</body>
</html>

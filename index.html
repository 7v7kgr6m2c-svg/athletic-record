<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>田徑成績記錄</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <!-- CDN 套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- 自訂獨立樣式 -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/picker.css">
    <link rel="stylesheet" href="css/tab.css">
    <link rel="stylesheet" href="css/cropper-custom.css">

    <script src="js/prevent-gestures.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8 select-none">

    <div class="max-w-2xl mx-auto space-y-6">
        <!-- 頂部導覽列 -->
        <div class="flex items-center justify-between bg-white p-4 rounded-3xl shadow-sm border border-slate-200/60">
            <div class="flex items-center gap-3">
                <img src="images/logo.png" alt="Logo" class="w-8 h-8">
                <div>
                    <h1 class="font-black text-lg text-slate-900">🏃 田徑成績管理</h1>
                    <span id="current-athlete-display" class="text-xs font-semibold text-orange-600">載入中...</span>
                </div>
            </div>
            <button onclick="window.location.href='select_sport.html'" class="text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition cursor-pointer">
                切換項目
            </button>
        </div>

        <!-- 成績列表容器 -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60">
            <h2 class="text-base font-bold text-slate-800 mb-4">歷史成績紀錄</h2>
            <div id="record-list" class="divide-y divide-slate-100">
                <div class="text-center text-slate-400 py-6">載入數據中...</div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main_a.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人田徑成績記錄網</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <!-- 頁面 1：註冊登入 (一開始只顯示這個) -->
  <div id="page-auth" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm space-y-4 my-12">
    <h2 id="auth-title" class="text-xl font-bold text-center text-slate-900">用戶登入</h2>
    <div class="space-y-3">
      <input type="email" id="auth-email" placeholder="電子郵件" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
      <input type="password" id="auth-password" placeholder="密碼" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
      <button onclick="handleAuth()" id="auth-btn" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">登入</button>
      <p class="text-xs text-center text-slate-500">
        <span id="auth-toggle-text">沒有帳戶？</span>
        <button onclick="toggleAuthMode()" class="text-blue-600 underline font-medium">切換註冊/登入</button>
      </p>
    </div>
  </div>

  <!-- 頁面 2：選擇運動員主頁 (登入後、進入主頁前) -->
  <div id="page-select-athlete" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm space-y-6 my-12 hidden">
    <div class="text-center">
      <h2 class="text-xl font-bold text-slate-900">👥 選擇運動員進入主頁</h2>
      <p class="text-xs text-slate-400 mt-1">每個帳戶最多可建立 3 名運動員</p>
    </div>
    
    <!-- 運動員列表 -->
    <div id="athlete-select-list" class="space-y-2"></div>

    <!-- 新增運動員控制區 (少於3人才顯示) -->
    <div id="add-athlete-form" class="border-t pt-4 space-y-3 hidden">
      <p class="text-sm font-medium text-slate-700">➕ 新增運動員資料</p>
      <input type="text" id="new-athlete-name" placeholder="請輸入運動員姓名" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
      <select id="new-athlete-gender" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
        <option value="M">男子組</option>
        <option value="F">女子組</option>
      </select>
      <button onclick="addAthlete()" class="w-full bg-emerald-600 text-white font-medium py-2 rounded-lg text-sm hover:bg-emerald-700 transition">確認新增</button>
    </div>
  </div>

  <!-- 頁面 3：你原本的田徑記錄主頁 (預設隱藏，選擇運動員後才完全展開) -->
  <div id="page-main-dashboard" class="max-w-3xl mx-auto space-y-6 hidden">
    <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">跑🏃‍♂️ 個人田徑成績記錄網</h1>
        <p class="text-slate-500 text-sm mt-1">目前運動員：<span id="current-athlete-name" class="font-bold text-blue-600 text-base"></span></p>
      </div>
      <div class="flex gap-2">
        <button onclick="backToSelect()" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-200">🔄 切換運動員</button>
        <button onclick="logout()" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100">登出</button>
      </div>
    </header>
    <div class="space-y-6">
      <!-- 1. 新增成績紀錄 -->
      <section class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">新增成績紀錄</h2>
        <form id="record-form" class="space-y-3" oninput="validateForm()">
          
          <!-- 賽事名稱 -->
          <div class="flex items-center gap-3">
            <label class="w-16 text-sm font-medium text-slate-700 whitespace-nowrap">賽事名稱 <span class="text-red-500">*</span></label>
            <input type="text" id="competition" placeholder="例: 香港田徑系列賽" class="flex-1 border rounded-lg p-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>

          <!-- 比賽日期 -->
          <div class="flex items-center gap-3">
            <label class="w-16 text-sm font-medium text-slate-700 whitespace-nowrap">比賽日期 <span class="text-red-500">*</span></label>
            <input type="date" id="date" class="flex-1 border rounded-lg p-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>

          <!-- 分類選擇按鈕 -->
          <div class="flex items-center gap-3">
            <label class="w-16 text-sm font-medium text-slate-700 whitespace-nowrap">類別</label>
            <div class="grid grid-cols-5 gap-0.5 p-1 bg-slate-100 rounded-lg text-xs font-medium text-center flex-1">
              <button type="button" onclick="filterCategory('all', this)" class="cat-btn py-1 rounded bg-white text-blue-600 shadow-sm transition">全部</button>
              <button type="button" onclick="filterCategory('track', this)" class="cat-btn py-1 rounded text-slate-600 hover:text-slate-900 transition">徑項</button>
              <button type="button" onclick="filterCategory('field', this)" class="cat-btn py-1 rounded text-slate-600 hover:text-slate-900 transition">田項</button>
              <button type="button" onclick="filterCategory('relay', this)" class="cat-btn py-1 rounded text-slate-600 hover:text-slate-900 transition">接力</button>
              <button type="button" onclick="filterCategory('combined', this)" class="cat-btn py-1 rounded text-slate-600 hover:text-slate-900 transition">全能</button>
            </div>
          </div>

          <!-- 項目與狀態 -->
          <div class="flex items-center gap-2">
            <label class="w-16 text-sm font-medium text-slate-700 whitespace-nowrap">項目</label>
            <div class="flex-1 flex items-center gap-2 min-w-0">
              <select id="event-select" onchange="onEventSelectChange()" class="flex-[3] w-0 border rounded-lg p-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              </select>
              
              <label class="text-sm font-medium text-slate-700 whitespace-nowrap">狀態 <span class="text-red-500">*</span></label>
              <select id="status-select" onchange="onStatusChange()" class="flex-[2.5] w-0 border rounded-lg p-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              </select>
            </div>
          </div>

          <!-- 一般項目成績與風速 -->
          <div id="single-event-inputs">
            <div class="flex items-center gap-3">
              <label id="result-label" class="w-16 text-sm font-medium text-slate-700 whitespace-nowrap">成績 <span class="text-red-500">*</span></label>
              
              <div class="flex items-center gap-2 flex-wrap">
                <!-- 時間格式 -->
                <div id="time-input-group" class="flex items-center gap-1">
                  <input type="number" id="time-min" min="0" placeholder="分" oninput="sanitizeDigit(this); validateForm();" class="w-12 border rounded-lg p-1 text-center text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500">
                  <span class="font-bold text-slate-500">:</span>
                  <input type="number" id="time-sec" min="0" max="59" placeholder="秒" oninput="sanitizeDigit(this); validateForm();" class="w-12 border rounded-lg p-1 text-center text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500">
                  <span class="font-bold text-slate-500">.</span>
                  <input type="number" id="time-ms" min="0" max="99" placeholder="毫秒" oninput="sanitizeDigit(this); validateForm();" class="w-12 border rounded-lg p-1 text-center text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 距離格式 -->
                <div id="distance-input-group" class="hidden flex items-center gap-1">
                  <input type="number" id="dist-m" min="0" placeholder="米" oninput="sanitizeDigit(this); validateForm();" class="w-14 border rounded-lg p-1 text-center text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500">
                  <span class="font-bold text-slate-500">.</span>
                  <input type="number" id="dist-cm" min="0" max="99" placeholder="厘米" oninput="sanitizeDigit(this); validateForm();" class="w-14 border rounded-lg p-1 text-center text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- 風速 -->
                <div id="wind-container" class="flex items-center gap-1 pl-2 border-l">
                  <label class="text-xs font-medium text-slate-500 whitespace-nowrap">風速</label>
                  <input type="number" id="wind" step="0.1" placeholder="+1.2" oninput="validateForm()" class="w-16 border rounded-lg p-1 text-center text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
              </div>
            </div>
          </div>

          <!-- 全能項目專屬輸入區 -->
          <div id="combined-event-inputs" class="hidden border-t pt-3 space-y-2">
            <div class="flex justify-between items-center">
              <label class="block text-sm font-bold text-blue-600">全能單項細項 <span class="text-red-500">*</span></label>
              <span class="text-xs text-slate-400">依順序填寫，分數自動加總</span>
            </div>
            <div id="sub-events-container" class="space-y-2 text-xs">
            </div>
            <div class="flex items-center gap-3 pt-2 border-t mt-2">
              <label class="w-16 text-sm font-bold text-slate-700">總分</label>
              <input type="number" id="total-score" placeholder="總分" class="w-28 border rounded-lg p-1 text-center bg-blue-50 font-bold text-blue-800" readonly>
            </div>
          </div>

          <button type="submit" id="submit-btn" disabled class="w-full bg-slate-300 text-slate-500 cursor-not-allowed font-medium py-2 rounded-lg transition duration-200 shadow mt-2">
            儲存紀錄
          </button>
        </form>
      </section>
      <!-- 2. 成績進步趨勢 -->
      <section class="bg-white p-6 rounded-xl shadow-sm">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-lg font-bold text-slate-900">成績進步趨勢</h2>
          <select id="chart-filter" onchange="updateChart()" class="border rounded-lg px-3 py-1 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </select>
        </div>
        <div class="h-64">
          <canvas id="progressChart"></canvas>
        </div>
      </section>

      <!-- 3. 歷史紀錄明細 -->
      <section class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">歷史紀錄明細</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse">
            <thead>
              <tr class="border-b bg-slate-50 text-slate-600 font-medium">
                <th class="p-2">日期</th>
                <th class="p-2">賽事名稱</th>
                <th class="p-2">項目</th>
                <th class="p-2">狀態</th>
                <th class="p-2">成績</th>
                <th class="p-2">風速</th>
              </tr>
            </thead>
            <tbody id="record-table-body" class="divide-y text-slate-700">
              <!-- 資料由資料庫動態載入 -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    // ⚙️ 專屬雲端資料庫連線設定
    const SUPABASE_URL = "https://7v7kgrnvqizyllyzfyen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IxHaOmI1ajjePc3dxcluqg__ulOsso6";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoginMode = true;
    let currentAthleteId = null;
    let progressChart = null; // 用於存放 Chart.js 實例

    // 網頁開啟時，自動偵測是否已經登入過
    window.onload = async function() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showSelectAthletePage();
      } else {
        showAuthPage();
      }
    };

    function showAuthPage() {
      document.getElementById('page-auth').classList.remove('hidden');
      document.getElementById('page-select-athlete').classList.add('hidden');
      document.getElementById('page-main-dashboard').classList.add('hidden');
    }

    function showSelectAthletePage() {
      document.getElementById('page-auth').classList.add('hidden');
      document.getElementById('page-select-athlete').classList.remove('hidden');
      document.getElementById('page-main-dashboard').classList.add('hidden');
      loadAthletes();
    }

    function showDashboardPage() {
      document.getElementById('page-auth').classList.add('hidden');
      document.getElementById('page-select-athlete').classList.add('hidden');
      document.getElementById('page-main-dashboard').classList.remove('hidden');
    }

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? '用戶登入' : '帳戶註冊';
      document.getElementById('auth-btn').innerText = isLoginMode ? '登入' : '註冊';
      document.getElementById('auth-toggle-text').innerText = isLoginMode ? '沒有帳戶？' : '已有帳戶？';
    }
    // 處理註冊與登入
    async function handleAuth() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if(!email || !password) return alert('請完整填寫帳密');

      if (isLoginMode) {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return alert('登入失敗: ' + error.message);
        showSelectAthletePage();
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) return alert('註冊失敗: ' + error.message);
        alert('註冊成功！系統已發送驗證信（若有開啟），現在請直接嘗試登入。');
        toggleAuthMode();
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    function backToSelect() {
      showSelectAthletePage();
    }

    // 讀取該用戶名下的所有運動員 (最多3人)
    async function loadAthletes() {
      const { data: athletes, error } = await supabase.from('athletes').select('*');
      if(error) return console.error(error);

      const listDiv = document.getElementById('athlete-select-list');
      listDiv.innerHTML = '';

      if (athletes.length === 0) {
        listDiv.innerHTML = `<p class="text-center text-slate-400 text-sm py-4">目前暫無運動員資料，請於下方新增。</p>`;
      }

      athletes.forEach(ath => {
        listDiv.innerHTML += `
          <button onclick="selectAthlete(${ath.id}, '${ath.name}')" class="w-full flex items-center justify-between p-3 border rounded-xl hover:bg-slate-50 transition text-left font-medium">
            <span>🏃 ${ath.name} (${ath.gender === 'M' ? '男' : '女'})</span>
            <span class="text-xs text-blue-600">點擊進入主頁 ➔</span>
          </button>
        `;
      });

      // 人數小於 3 人才顯示新增表單
      const addBox = document.getElementById('add-athlete-form');
      if (athletes.length < 3) {
        addBox.classList.remove('hidden');
      } else {
        addBox.classList.add('hidden');
      }
    }

    // 新增運動員
    async function addAthlete() {
      const name = document.getElementById('new-athlete-name').value;
      const gender = document.getElementById('new-athlete-gender').value;
      if (!name) return alert('請輸入運動員姓名');

      const { data: { user } } = await supabase.auth.getUser();

      const { error } = await supabase.from('athletes').insert([
        { user_id: user.id, name: name, gender: gender }
      ]);

      if (error) {
        alert('新增失敗（可能已達3人上限）: ' + error.message); 
      } else {
        document.getElementById('new-athlete-name').value = '';
        loadAthletes();
      }
    }

    function selectAthlete(id, name) {
      currentAthleteId = id;
      document.getElementById('current-athlete-name').innerText = name;
      showDashboardPage();
      loadRecords();  // 載入該運動員的專屬成績
    }
    // 讀取該運動員的歷史成績並更新表格與圖表
    async function loadRecords() {
      // (程式碼實作：取得 Supabase 資料、渲染表格、更新圖表篩選器)
      // ...
    }

    // 更新 Chart.js 圖表函數
    function updateChart() {
      // (程式碼實作：過濾資料、轉換成 Chart.js 格式、銷毀/重建圖表)
      // ...
    }

    // 處理表單提交，將成績寫入 Supabase
    document.getElementById('record-form').onsubmit = async function(e) {
      // (程式碼實作：組合資料、發送至 Supabase、重置表單)
      // ...
    };

    // ========================================================
    // 🔄 以下為前端按鈕切換與初始化邏輯
    // ========================================================
    
    // 初始化下拉選單、類別切換、欄位驗證等功能
    // (包含 eventDatabase, filterCategory, onEventSelectChange 等函數)
    // ...

    // 啟動初始化
    initSelectors();
  </script>
</body>
</html>

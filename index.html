<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- Viewport 鎖定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>運動紀錄系統 - 快捷登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 禁用手勢與雙擊縮放，全版面鎖定禁止滑動 */
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100%;
            overflow: hidden;
            margin: 0;
        }

        /* 強制輸入框字級降至最低 16px */
        input, select, textarea {
            font-size: 16px !important;
        }

        .login-card { 
            width: 100%; 
            max-width: 440px; 
            padding: 40px 32px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px; 
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05); 
            text-align: center; 
            box-sizing: border-box; 
        }

        .btn-oauth { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: 700; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }
        .btn-oauth:active { transform: scale(0.98); }
        .btn-google { background-color: #4285F4; }
        .btn-google:hover { background-color: #3367d6; }
    </style>
    <script>
      // 全方位攔截 iOS Safari 手勢與雙擊縮放
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });

      document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { e.preventDefault(); }
        lastTouchEnd = now;
      }, false);
    </script>
</head>
<body class="h-screen w-screen flex items-center justify-center select-none p-6 overflow-hidden">

    <div class="login-card">
        <!-- 精美視覺 Icon -->
        <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
        </div>

        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">歡迎使用運動紀錄系統</h2>
        <p class="text-sm text-slate-500 mb-8 font-medium">請透過 Google 帳戶登入您的專屬管理系統</p>

        <button onclick="handleGoogleLogin()" class="btn-oauth btn-google">
            <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>使用 Google 帳戶快捷登入</span>
        </button>
    </div>

    <!-- 自訂 Modal -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="custom-alert-icon" class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">❌</div>
            <p id="custom-alert-msg" class="text-sm font-medium text-slate-800 whitespace-pre-line"></p>
            <button onclick="closeCustomAlert()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow cursor-pointer transition">確認</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA40NWznF4c7Gz2FNzVTCyse_Tm9gp-1n0",
            authDomain: "athletes-record.firebaseapp.com",
            projectId: "athletes-record",
            storageBucket: "athletes-record.appspot.com",
            messagingSenderId: "259439207122",
            appId: "1:259439207122:web:26d6211ac1379c936e030b",
            measurementId: "G-F3ZH9YN0VT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.showAlert = function(msg) {
            document.getElementById('custom-alert-msg').textContent = msg;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        window.closeCustomAlert = function() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'athletes.html';
            }
        });

        window.handleGoogleLogin = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                window.location.href = 'athletes.html';
            } catch (error) {
                showAlert('Google 登入失敗：' + error.message);
            }
        };
    </script>
</body>
</html>

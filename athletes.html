<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>選擇運動員</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/prevent-gestures.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8 select-none">

    <div class="max-w-md mx-auto space-y-6">
        <!-- 頁首標題區 -->
        <div class="flex justify-between items-center bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60">
            <div class="flex items-center gap-3">
                <img src="images/logo.png" alt="Logo" class="w-10 h-10">
                <div>
                    <h1 class="text-xl font-black text-slate-900">運動員列表</h1>
                    <p class="text-xs text-slate-400 font-medium">請選擇要管理的選手</p>
                </div>
            </div>
            <button id="logout-btn" class="text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-xl transition cursor-pointer">
                登出
            </button>
        </div>

        <!-- 運動員卡片清單區域 -->
        <div id="athletes-list" class="space-y-3">
            <div class="text-center text-slate-400 py-8">載入運動員資料中...</div>
        </div>
    </div>

    <script type="module" src="js/athletes.js"></script>
</body>
</html>

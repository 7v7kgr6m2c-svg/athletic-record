<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游泳紀錄管理</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/tab.css">
  <style>
    :root {
      --primary-color: #0288d1;
      --bg-color: #e0f7fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .profile-card, .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .profile-card {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .avatar-container {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ccc;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-info h2 {
      margin: 0 0 5px 0;
      font-size: 1.2rem;
    }
    .profile-info p {
      margin: 2px 0;
      font-size: 0.85rem;
      color: #666;
    }
    form input, form select, form button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    form button {
      background: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 運動員資訊卡 -->
    <div class="profile-card">
      <div class="avatar-container">
        <img id="avatar-img" src="" alt="運動員頭像">
      </div>
      <div class="profile-info">
        <h2 id="athlete-name">載入中...</h2>
        <p id="athlete-dob">出生日期: --</p>
        <p id="athlete-age">年齡: --</p>
        <p id="athlete-gender">性別: --</p>
      </div>
    </div>

    <!-- 紀錄輸入表單 -->
    <div class="card">
      <h3>新增游泳紀錄</h3>
      <form id="record-form">
        <input type="date" id="record-date" required>
        <select id="record-category">
          <option value="freestyle">自由式</option>
          <option value="breaststroke">蛙式</option>
          <option value="backstroke">仰式</option>
          <option value="butterfly">蝶式</option>
        </select>
        <input type="text" id="record-item" placeholder="距離 (例如: 50m, 100m)" required>
        <input type="number" step="0.01" id="record-value" placeholder="時間 (秒)" required>
        <button type="submit">儲存紀錄</button>
      </form>
    </div>

    <!-- 歷史圖表 -->
    <div class="card">
      <h3>成績趨勢圖</h3>
      <canvas id="performance-chart"></canvas>
    </div>
  </div>

  <script type="module" src="js/main_s.js"></script>
</body>
</html>

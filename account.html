<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <!-- 1. 標準 SVG Favicon（加上 ?v=1 避開快取） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">

    <!-- 2. 備用 PNG / ICO 格式（建議準備一份 32x32 的 PNG 或 ICO） -->
    <link rel="alternate icon" type="image/png" href="/favicon_180x180.png?v=1">

    <!-- 3. iOS / Apple 裝置專用圖示（加書籤或分頁卡片時會讀取這張） -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_180x180.png?v=1">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Track & Wave - 個人帳戶設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-text-size-adjust: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 頂部導覽列 Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="athletes.html" class="flex items-center gap-2">
                <span class="font-black text-slate-800 text-lg">Track & Wave</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="athletes.html" class="text-xs sm:text-sm font-bold text-slate-600 hover:text-sky-600 transition">返回主頁</a>
                <button id="btn-logout" class="text-xs sm:text-sm font-bold text-red-500 hover:text-red-600 transition cursor-pointer">登出</button>
            </div>
        </div>
    </header>

    <!-- 主內容區塊 -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 my-4 space-y-6">
        
        <div>
            <h1 class="text-2xl font-black text-slate-800">個人帳戶設定</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">管理您的登入密碼與訂閱方案</p>
        </div>

        <!-- 帳戶資訊卡片 -->
        <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-base font-bold text-slate-700 pb-2 border-b border-slate-100">帳戶資料</h2>
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                <span class="text-xs sm:text-sm text-slate-400 font-medium">電子郵件 (Email)</span>
                <span id="user-email" class="text-sm sm:text-base font-bold text-slate-700">載入中...</span>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 pt-2">
                <span class="text-xs sm:text-sm text-slate-400 font-medium">目前的訂閱方案</span>
                <div class="flex items-center gap-2">
                    <span id="plan-badge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">免費版</span>
                </div>
            </div>
        </div>

        <!-- 登入安全性（原綁定 / 重設 Email 密碼區塊） -->
        <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-100 space-y-4">
            <div>
                <h2 class="text-base font-bold text-slate-700">登入與安全性</h2>
                <p class="text-xs text-slate-400 mt-0.5">綁定密碼後即可同時支援使用 Email 與密碼直接登入系統</p>
            </div>

            <div class="pt-2">
                <button type="button" onclick="openLinkModal()" class="w-full sm:w-auto px-6 py-3 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 font-bold rounded-xl shadow-sm transition text-sm flex items-center justify-center gap-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <span>綁定 / 重設 Email 密碼登入</span>
                </button>
            </div>
        </div>

        <!-- 訂閱管理卡片 -->
        <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-100 space-y-4">
            <div>
                <h2 class="text-base font-bold text-slate-700">訂閱狀態與管理</h2>
                <p class="text-xs text-slate-400 mt-0.5">點擊下方按鈕以變更、升級或取消您的訂閱方案</p>
            </div>

            <div class="pt-2">
                <button type="button" id="btn-manage-subscription" class="w-full sm:w-auto px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    <span>管理訂閱 (Stripe 門戶)</span>
                </button>
            </div>
        </div>

    </main>

    <!-- 綁定 Email/密碼 Modal 彈窗 -->
    <div id="link-password-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-900 text-center">綁定 / 重設 Email 密碼</h3>
            <p class="text-xs text-slate-500 text-center font-medium">設定密碼後，未來您也可以使用目前的 Email 電子郵件與此密碼登入系統。</p>
            
            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">設定新密碼</label>
                    <input type="password" id="new-password-input" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="至少8位，包含大小寫字母與數字">
                </div>
                <div class="text-[11px] text-slate-400 space-y-0.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <p class="font-semibold text-slate-500">密碼需符合以下要求：</p>
                    <p>• 長度至少 8 個字元</p>
                    <p>• 包含至少一個大寫字母 (A-Z)</p>
                    <p>• 包含至少一個小寫字母 (a-z)</p>
                    <p>• 包含至少一個數字 (0-9)</p>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeLinkModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-sm transition cursor-pointer">取消</button>
                <button type="button" onclick="handleLinkPassword()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow transition cursor-pointer">確認綁定</button>
            </div>
        </div>
    </div>

    <!-- 自訂 Alert Modal -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="custom-alert-icon" class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">i</div>
            <p id="custom-alert-msg" class="text-sm font-medium text-slate-800 whitespace-pre-line"></p>
            <button onclick="closeCustomAlert()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm shadow cursor-pointer transition">確認</button>
        </div>
    </div>

    <!-- Firebase 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, EmailAuthProvider, linkWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA40NWznF4c7Gz2FNzVTCyse_Tm9gp-1n0",
            authDomain: "athletes-record.firebaseapp.com",
            projectId: "athletes-record",
            storageBucket: "athletes-record.appspot.com",
            messagingSenderId: "259439207122",
            appId: "1:259439207122:web:26d6211ac1379c936e030b",
            measurementId: "G-F3ZH9YN0VT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.showAlert = function(msg, icon = 'i') {
            document.getElementById('custom-alert-msg').textContent = msg;
            const iconEl = document.getElementById('custom-alert-icon');
            iconEl.textContent = icon;
            if (icon === '✅') {
                iconEl.className = 'w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold';
            } else if (icon === '❌' || icon === '⚠️') {
                iconEl.className = 'w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold';
            } else {
                iconEl.className = 'w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold';
            }
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        window.closeCustomAlert = function() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }

        // 綁定 Modal 控制
        window.openLinkModal = function() {
            document.getElementById('link-password-modal').classList.remove('hidden');
        }

        window.closeLinkModal = function() {
            document.getElementById('link-password-modal').classList.add('hidden');
            document.getElementById('new-password-input').value = '';
        }

        // 執行綁定或更新密碼
        window.handleLinkPassword = async function() {
            const user = auth.currentUser;
            const password = document.getElementById('new-password-input').value;

            if (!user) {
                showAlert('請先登入帳戶！', '⚠️');
                return;
            }

            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

            if (!password || !passwordRegex.test(password)) {
                showAlert('密碼不符合安全性規定：\n• 長度至少 8 位數\n• 必須包含大寫字母\n• 必須包含小寫字母\n• 必須包含數字', '⚠️');
                return;
            }

            try {
                const hasPassword = user.providerData.some(p => p.providerId === 'password');

                if (hasPassword) {
                    await updatePassword(user, password);
                    showAlert(`成功重設密碼！未來請使用新的密碼登入。`, '✅');
                } else {
                    const credential = EmailAuthProvider.credential(user.email, password);
                    await linkWithCredential(user, credential);
                    showAlert(`成功為 ${user.email} 設定密碼！未來可以使用 Email / 密碼 登入。`, '✅');
                }
                closeLinkModal();
            } catch (err) {
                console.error('操作失敗：', err);
                if (err.code === 'auth/weak-password' || err.code === 'auth/password-policy-autherror') {
                    showAlert('密碼強度不足或不符合政策規定，請重新設定！', '⚠️');
                } else if (err.code === 'auth/provider-already-linked') {
                    try {
                        await updatePassword(user, password);
                        showAlert(`已更新密碼！未來請使用新的密碼登入。`, '✅');
                        closeLinkModal();
                    } catch (updateErr) {
                        showAlert('更新密碼失敗：' + updateErr.message, '❌');
                    }
                } else if (err.code === 'auth/credential-already-in-use') {
                    showAlert('此 Email 憑證已被其他帳號使用！', '❌');
                } else if (err.code === 'auth/requires-recent-login') {
                    showAlert('敏感操作，請登出後重新登入再嘗試設定。', '⚠️');
                } else {
                    showAlert('設定失敗：' + err.message, '❌');
                }
            }
        };

        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').textContent = user.email || '已登入';
            } else {
                window.location.href = 'index.html';
            }
        });

        // 登出
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
